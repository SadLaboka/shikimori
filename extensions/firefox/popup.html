<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Цветовые схемы · SadLaboka</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.mjs"></script>
</head>
<body>
  <header><img src="icons/schemes.svg" width="36" height="36" alt=""><div><h1>Цветовые схемы</h1><p>Shikimori · SadLaboka</p></div><button id="refresh" class="quiet" aria-label="Обновить состояние" title="Обновить состояние">↻</button></header>
  <main>
    <p class="account-note">Меняет CSS твоего аккаунта на Shikimori.</p>
    <p id="current" class="current">Проверяем текущее оформление…</p>
    <section class="schemes" aria-label="Готовые схемы" id="schemes"></section>
    <label class="reload"><input type="checkbox" id="reload" checked>Обновлять текущую вкладку после применения</label>
    <div id="status" role="status" aria-live="polite">Подключаемся к Shikimori…</div>
    <button id="reconcile" class="wide" hidden>Проверить результат</button>
    <button id="restore" class="wide secondary" disabled>Вернуть предыдущий CSS</button>
    <button id="open" class="wide quiet">Открыть Shikimori</button>
  </main>
  <footer>Предыдущий CSS сохраняется в Firefox.</footer>
</body>
</html>
